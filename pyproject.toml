[project]
name = "agent"
version = "0.1.0"
description = "Home Jarvis multi-agent runtime built with AgentScope"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agentscope==2.0.4.post1",
  "anthropic>=0.117.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dashscope = ["dashscope>=1.26"]
openai = ["openai>=1.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
]

[project.scripts]
agent = "agent.cli:main"
agent-web = "agent.web:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
