name: home-jarvis

services:
  app:
    build:
      context: .
      target: runtime
    image: home-jarvis:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENT_WEB_HOST: 0.0.0.0
      AGENT_WEB_PORT: 8000
      AGENT_WEB_ALLOWED_ORIGINS: ""
      AGENT_WEB_DATABASE_PATH: /data/agent-web.sqlite3
      BABYBUDDY_AUDIT_PATH: /data/audit/events.jsonl
      BABYBUDDY_MEDIA_URL: "${BABYBUDDY_MEDIA_URL:-http://baby.home}"
    ports:
      - "${HOME_JARVIS_PORT:-18080}:8000"
    volumes:
      - ./agent_data:/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  agent_data:
    name: home-jarvis-data
